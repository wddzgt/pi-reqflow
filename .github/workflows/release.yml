name: Publish container

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check release version and image name
        id: image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) throw new Error('Tag must match package.json version');
          const image = `ghcr.io/${process.env.IMAGE_REPOSITORY.toLowerCase()}`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `name=${image}\nversion=${version}\n`);
          JS
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.title=pi-reqflow
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.licenses=MIT
